# Chama o banco uma vez por dia para o projeto gratuito do Supabase não pausar
# por falta de uso (férias, recesso). Usa só a chave pública (anon) do config.js.
# Também se "reativa" a cada execução: o GitHub desliga agendamentos de repositórios
# sem nenhuma alteração por 60 dias, e isso zera essa contagem.
name: Manter o banco ativo

on:
  schedule:
    - cron: "17 11 * * *"   # todo dia às 08:17 (Brasília)
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chamar o banco
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js)
          for i in 1 2 3; do
            RESP=$(curl -s -m 30 -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Resposta: $RESP"
            [ "$RESP" = '"ok"' ] && exit 0
            sleep 20
          done
          echo "::error::O banco não respondeu. Veja se o projeto no Supabase está pausado."
          exit 1
      - name: Manter este agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/manter-ativo.yml/enable" || true
